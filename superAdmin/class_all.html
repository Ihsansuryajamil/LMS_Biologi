<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body class="dashboard-page">

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="school-logo">
                <i class="fa-solid fa-school text-primary"></i>
                <div>Sekolah<br>Nama Sekolah/ Kampus</div>
            </div>
        </div>
        
        <div class="user-profile">
            <img src="https://ui-avatars.com/api/?name=Staff+Komputer&background=e0e0e0&color=333" alt="User">
            <div>
                <div class="fw-bold">Staff Komputer</div>
                <div class="text-muted small">Guru</div>
            </div>
        </div>

        <div class="sidebar-actions">
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary w-50 d-flex justify-content-between align-items-center rounded-pill">
                    <span>Notifikasi</span> <i class="fa-solid fa-bell"></i>
                </button>
                <a href="profile.html" class="btn btn-outline-secondary w-50 d-flex justify-content-between align-items-center rounded-pill active bg-light text-dark">
                    <span>Profil</span> <i class="fa-solid fa-user"></i>
                </a>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-home text-primary"></i> Dashboard</a>
            <a href="class_all.html" class="nav-link active"><i class="fa-solid fa-chalkboard-user text-success"></i> Kelas</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-gear"></i> Pengaturan Website</a>
        </nav>

        <div class="sidebar-footer">
            <div class="d-flex align-items-center justify-content-between border rounded p-2 mb-2 bg-light">
                <div class="d-flex align-items-center gap-2">
                    <img src="https://flagcdn.com/w20/id.png" alt="ID" width="20"> <span class="fw-bold">Indonesia</span>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <img src="https://flagcdn.com/w20/id.png" alt="ID" width="16" class="opacity-50">
                    <img src="https://flagcdn.com/w20/gb.png" alt="EN" width="16">
                </div>
            </div>
            <a href="#" class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center rounded-pill mb-2 py-1">
                <span>Keluar</span> <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
            <a href="../index.html" class="btn btn-light border w-100 rounded-pill py-1 text-muted">
                Kembali ke halaman utama
            </a>
        </div>
    </div>

    <div class="main-content">
        
        <div class="topbar d-flex align-items-center w-100">
            <div class="d-flex align-items-center gap-3 w-100">
                <span class="fw-bold"><i class="fa-solid fa-chalkboard"></i> Kelas Saya</span>
                <select class="form-select w-auto"><option>Tahun Pelajaran 2025/2026 - (Aktif)</option></select>
                <select class="form-select w-auto"><option>Pilih Mata Pelajaran</option></select>
                
                <div class="input-group ms-auto" style="width: 250px;">
                    <input type="text" class="form-control" placeholder="Cari disini...">
                    <button class="btn btn-outline-secondary"><i class="fa-solid fa-search"></i></button>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                <div>
                    <a href="#" class="text-decoration-none fw-bold border-bottom border-primary border-3 pb-2 text-dark">Reguler</a>
                </div>
                <a href="kelas_tambah.html" class="btn btn-link text-decoration-none"><i class="fa-solid fa-plus"></i> Buat Kelas</a>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-4">
                <div class="col">
                    <div class="class-card">
                        <div class="card-cover">
                            <span class="text-muted small"><i class="fa-regular fa-file-lines"></i> 9B Semester Ganjil</span>
                        </div>
                        <div class="card-banner-pink">
                            <i class="fa-regular fa-square-check"></i>
                            <span>Materi:<br><strong>Informatika</strong></span>
                        </div>
                        <div class="p-3">
                            <!-- <h6 class="fw-bold">IX B-INFORMATIKA (KOMP)</h6>
                            <p class="text-muted small mb-3">Informatika<br>Tingkat: 9 SMP</p> -->
                            
                            <div class="d-flex justify-content-between text-muted small mb-3">
                                <span><i class="fa-solid fa-users"></i> 15 Peserta</span>
                                <span><i class="fa-regular fa-calendar"></i> 14/07/25</span>
                            </div>
                            
                            <!-- <div class="badge badge-approved w-100 p-2 text-center rounded mb-2">
                                <i class="fa-solid fa-check-circle"></i> Kelas Disetujui
                            </div> -->
                            <a href="class_detail.html" class="btn btn-light w-100 text-primary border border-primary-subtle rounded-pill">Masuk Kelas</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
