<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body class="dashboard-page">

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="school-logo">
                <i class="fa-solid fa-school fa-2x text-primary"></i>
                <div>
                    Sekolah<br>Nama Sekolah/ Kampus
                </div>
            </div>
        </div>
        
        <div class="user-profile">
            <img src="default-avatar.png" alt="User">
            <div>
                <div class="fw-bold">Staff Komputer</div>
                <div class="text-muted small">Guru</div>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-link active"><i class="fa-solid fa-home"></i> Dashboard</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-book"></i> Bahan Ajar</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-clipboard-list"></i> ATP</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-chalkboard-user"></i> Kelas</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-server"></i> Bank Soal</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-calendar-alt"></i> Jadwal</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-chart-bar"></i> Laporan</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- TOPBAR AKAN BERUBAH SESUAI HALAMAN -->
        
        <!-- KONTEN HALAMAN DIMULAI DI SINI -->
        <div class="content-area">
            <!-- Isi dengan salah satu blok kode di bawah (Dashboard / Detail / Tambah) -->
            <!-- Topbar Khusus Tambah Kelas -->
            <div class="topbar">
                <div class="d-flex align-items-center gap-3">
                    <a href="dashboard.html" class="btn btn-outline-secondary rounded-pill"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
                    <h5 class="mb-0">Buat Kelas Vocational</h5>
                </div>
            </div>

            <div class="content-area d-flex justify-content-center">
                <div class="w-100" style="max-width: 800px;">
                    
                    <div class="row mb-4 align-items-center">
                        <div class="col-md-3 text-muted small fw-bold text-end">NAMA KELAS</div>
                        <div class="col-md-9">
                            <input type="text" class="form-control border-0 border-bottom rounded-0 px-0" placeholder="Nama Kelas">
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-md-3 text-muted small fw-bold text-end">MATA PELAJARAN</div>
                        <div class="col-md-9 d-flex gap-2">
                            <select class="form-select"><option>Pilih Mata Pelajaran</option></select>
                            <button class="btn btn-outline-secondary"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-md-3 text-muted small fw-bold text-end">TINGKAT</div>
                        <div class="col-md-9">
                            <select class="form-select"><option>Pilih Tingkat</option></select>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-3 text-muted small fw-bold text-end mt-2">ENROLL KODE</div>
                        <div class="col-md-9">
                            <input type="text" class="form-control mb-2" placeholder="Masukan Enroll Kode">
                            <div class="alert alert-info py-2 small mb-0 border-0 bg-info bg-opacity-10 text-info-emphasis">
                                <i class="fa-solid fa-circle-info"></i> Enroll Code adalah kode rahasia untuk Anda bagikan kepada siswa yang ingin masuk ke kelas Anda.
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-3 text-muted small fw-bold text-end mt-2">DESKRIPSI KELAS</div>
                        <div class="col-md-9">
                            <div class="editor-toolbar d-flex flex-wrap gap-1 align-items-center">
                                <select class="form-select form-select-sm w-auto border-0"><option>Font</option></select>
                                <select class="form-select form-select-sm w-auto border-0"><option>Size</option></select>
                                <span class="text-muted px-2">|</span>
                                <button><i class="fa-solid fa-bold"></i></button>
                                <button><i class="fa-solid fa-italic"></i></button>
                                <button><i class="fa-solid fa-strikethrough"></i></button>
                                <button><i class="fa-solid fa-subscript"></i></button>
                                <button><i class="fa-solid fa-superscript"></i></button>
                                <span class="text-muted px-2">|</span>
                                <button><i class="fa-solid fa-list-ol"></i></button>
                                <button><i class="fa-solid fa-list-ul"></i></button>
                            </div>
                            <div class="editor-content bg-white" contenteditable="true"></div>
                        </div>
                    </div>

                    <div class="row mb-5">
                        <div class="col-md-3"></div>
                        <div class="col-md-9">
                            <div class="upload-cover-box">
                                <button class="btn btn-light border position-absolute bottom-0 start-0 m-3 rounded-pill shadow-sm">
                                    <i class="fa-regular fa-image"></i> Tambah Sampul
                                </button>
                            </div>
                            <div class="text-end mt-4">
                                <button class="btn btn-primary rounded-pill px-4"><i class="fa-solid fa-plus"></i> Buat Kelas</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
