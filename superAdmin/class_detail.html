<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Kelas - LMS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body class="dashboard-page">

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="school-logo">
                <i class="fa-solid fa-school fa-2x text-primary"></i>
                <div>
                    Sekolah<br>Nama Sekolah/ Kampus
                </div>
            </div>
        </div>
        
        <div class="user-profile">
            <img src="default-avatar.png" alt="User">
            <div>
                <div class="fw-bold">Staff Komputer</div>
                <div class="text-muted small">Guru</div>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="#" class="nav-link active"><i class="fa-solid fa-home"></i> Dashboard</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-book"></i> Bahan Ajar</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-clipboard-list"></i> ATP</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-chalkboard-user"></i> Kelas</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-server"></i> Bank Soal</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-calendar-alt"></i> Jadwal</a>
            <a href="#" class="nav-link"><i class="fa-solid fa-chart-bar"></i> Laporan</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- TOPBAR AKAN BERUBAH SESUAI HALAMAN -->
        
        <!-- KONTEN HALAMAN DIMULAI DI SINI -->
        <div class="content-area">
           <!-- Topbar Khusus Detail -->
            <div class="topbar">
                <div class="d-flex align-items-center gap-3">
                    <a href="dashboard.html" class="btn btn-outline-secondary rounded-pill"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
                    <h5 class="mb-0 fw-bold">IX B-INFORMATIKA (KOMP)</h5>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-success small fw-bold"><i class="fa-solid fa-check-circle"></i> Kelas Disetujui</span>
                    <button class="btn btn-outline-secondary rounded-pill"><i class="fa-solid fa-share-nodes"></i> Bagikan</button>
                </div>
            </div>

            <div class="content-area">
                <!-- Tabs -->
                <ul class="nav nav-tabs mb-4">
                    <li class="nav-item"><a class="nav-link active fw-bold" href="#">Topik <span class="badge bg-light text-dark">9</span></a></li>
                    <li class="nav-item"><a class="nav-link text-muted" href="#">Anggota <span class="badge bg-light text-dark">15</span></a></li>
                    <li class="nav-item"><a class="nav-link text-muted" href="#"><i class="fa-regular fa-comments"></i> Diskusi</a></li>
                    <li class="nav-item"><a class="nav-link text-muted" href="#"><i class="fa-solid fa-gear"></i> Pengaturan</a></li>
                    <li class="nav-item ms-auto"><span class="nav-link border-0 text-muted">Informatika</span></li>
                </ul>

                <!-- Actions -->
                <div class="d-flex justify-content-between mb-4">
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary"><i class="fa-regular fa-copy"></i> Salin <i class="fa-solid fa-chevron-down ms-1 small"></i></button>
                        <button class="btn btn-outline-secondary"><i class="fa-solid fa-bolt"></i> Aksi <i class="fa-solid fa-chevron-down ms-1 small"></i></button>
                        <button class="btn btn-outline-secondary"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Jadwal</button>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted small">Filter Berdasarkan:</span>
                        <select class="form-select w-auto"><option>Semua Topik</option></select>
                    </div>
                </div>

                <button class="btn btn-light w-100 border border-dashed text-primary py-3 mb-4 border-2" style="border-style: dashed !important;">
                    <i class="fa-solid fa-plus"></i> Buat Topik Baru
                </button>

                <!-- List Item -->
                <div class="topic-item d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-4">
                        <div class="bg-warning text-white rounded p-3">
                            <i class="fa-solid fa-hashtag fa-lg"></i>
                        </div>
                        <div>
                            <div class="mb-1">
                                <span class="small text-muted me-2"><i class="fa-solid fa-list"></i> 7 materi</span>
                                <span class="badge bg-danger bg-opacity-10 text-danger rounded-pill"><i class="fa-solid fa-circle-info"></i> Topik Belum Selesai</span>
                            </div>
                            <h6 class="fw-bold mb-0">Browser dan CMS</h6>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-4">
                        <span class="text-muted">Semester 1</span>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success rounded-pill"><i class="fa-solid fa-paper-plane"></i> Publish</button>
                            <button class="btn btn-outline-danger rounded-pill">Unpublish</button>
                            <button class="btn btn-light text-danger border"><i class="fa-solid fa-lock"></i></button>
                            <button class="btn btn-light border">Import <i class="fa-solid fa-chevron-down small"></i></button>
                            <button class="btn btn-light border"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn btn-light border"><i class="fa-solid fa-ellipsis"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
